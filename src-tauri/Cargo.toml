[package]
name = "le-chat-local"
version = "0.1.0"
description = "Le Chat Local - AI Chat powered by LM Studio"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.71"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.0-rc.17", features = [] }
tauri-plugin-shell = "2.0.0-rc"
tauri-plugin-http = "2.0.0-rc"
reqwest = { version = "0.11", features = ["stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
base64 = "0.22"
scraper = "0.20"
env_logger = "0.11"
urlencoding = "2.1"
chrono = "0.4"
url = "2.5"
futures = "0.3"
whatlang = "0.16"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4"] }
